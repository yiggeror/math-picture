<!doctype html>
<meta charset="utf-8">
<title>Starry Night epicycles</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
<canvas id="c"></canvas>
<script>
// Frame-by-frame renderer. render.js serves this folder, calls init() once, then renderFrame(0..total-1).
//
// Story: one circle draws a circle. Every round the number of circles doubles and the pen draws the
// whole picture again; earlier rounds stay behind as fading coloured layers. Few circles can only draw
// the coarse shape, more circles add finer detail, so The Starry Night condenses out of the scribble.
// Rounds get shorter as the changes get smaller. The last round starts in close-up on the pen and its
// thousands of tiny circles, pulls back as the pen accelerates, and closes the picture at the climax.

let CFG, META, W, H, PW, PH, S, OS, NR;
let FREQ, AMP, PHASE, K;
let TRAILS, ROUND_OFF, ROUND_LEN;   // all round curves in one buffer
let UP, PAL, PAL_LUM;               // per sample: pen up, palette index
const canvas = document.getElementById('c');
let ctx, small, sctx, small2, sctx2;

const clamp01 = t => Math.max(0, Math.min(1, t));
const smooth = t => { t = clamp01(t); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;

let F_INTRO, ROUND_START, ROUND_FRAMES, F_CLIMAX, TOTAL, ROUND_VIEW;

async function init() {
  const get = async (p, kind) => { const r = await fetch(p); return kind === 'json' ? r.json() : r.arrayBuffer(); };
  CFG = await get('config.json', 'json');
  META = await get('data/meta.json', 'json');
  W = CFG.width; H = CFG.height;
  canvas.width = W; canvas.height = H;
  ctx = canvas.getContext('2d');
  small = new OffscreenCanvas(W / 4, H / 4); sctx = small.getContext('2d');
  small2 = new OffscreenCanvas(W / 4, H / 4); sctx2 = small2.getContext('2d');
  PW = META.paintingWidth; PH = META.paintingHeight;
  S = META.samples; OS = META.finalOversample; NR = META.rounds.length;

  const terms = await get('data/terms.bin');
  K = META.terms;
  FREQ = new Int32Array(terms, 0, K);
  AMP = new Float32Array(terms, 4 * K, K);
  PHASE = new Float32Array(terms, 8 * K, K);

  TRAILS = new Float32Array(await get('data/trails.bin'));
  ROUND_OFF = []; ROUND_LEN = [];
  let off = 0;
  for (let i = 0; i < NR; i++) {
    const n = S * (i === NR - 1 ? OS : 1);
    ROUND_OFF.push(off); ROUND_LEN.push(n);
    off += 2 * n;
  }
  const attr = new Uint8Array(await get('data/attr.bin'));
  UP = new Uint8Array(S); PAL = new Uint8Array(S);
  for (let i = 0; i < S; i++) { UP[i] = attr[2 * i]; PAL[i] = attr[2 * i + 1]; }
  const lum = META.palette.map(([r, g, b]) => 0.3 * r + 0.59 * g + 0.11 * b);
  const lo = Math.min(...lum), hi = Math.max(...lum);
  PAL_LUM = lum.map(v => (v - lo) / (hi - lo + 1e-6));

  const fps = CFG.fps;
  F_INTRO = Math.round(CFG.intro * fps);
  ROUND_START = []; ROUND_FRAMES = [];
  let f = F_INTRO;
  for (const r of CFG.rounds) { ROUND_START.push(f); const n = Math.round(r.seconds * fps); ROUND_FRAMES.push(n); f += n; }
  F_CLIMAX = f;
  TOTAL = F_CLIMAX + Math.round(CFG.after * fps);
  // each round is framed to fit its own curve, so the camera pulls back as the picture grows
  ROUND_VIEW = [];
  for (let i = 0; i < NR; i++) {
    const off = ROUND_OFF[i], n = ROUND_LEN[i];
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (let k = 0; k < n; k += 4) {
      const x = TRAILS[off + 2 * k], y = TRAILS[off + 2 * k + 1];
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    const Z = Math.max(Z_FULL, Math.min(2.6, (W * 0.8) / (x1 - x0), (H * 0.62) / (y1 - y0)));
    ROUND_VIEW.push({ Z, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 });
  }
  return { total: TOTAL, fps };
}

// ---------- timing ----------
function roundAt(f) {
  for (let i = NR - 1; i >= 0; i--) if (f >= ROUND_START[i]) return i;
  return -1;
}
const FINAL_ACCEL = 6;
function progress(i, u) {
  if (i === NR - 1) return (Math.exp(FINAL_ACCEL * u) - 1) / (Math.exp(FINAL_ACCEL) - 1);  // slow in close-up, then a rush
  return lerp(u, smooth(u), 0.3);
}

// ---------- camera ----------
const Z_FULL = 0.94, Z_CLOSE = 6;
function blendView(a, b, t) {
  // zoom in log space so the move feels even
  return { Z: Math.exp(lerp(Math.log(a.Z), Math.log(b.Z), t)), cx: lerp(a.cx, b.cx, t), cy: lerp(a.cy, b.cy, t) };
}
function camera(f, i, u, p) {
  const full = { Z: Z_FULL, cx: PW / 2, cy: PH / 2 };
  if (f >= F_CLIMAX) {
    const s = (f - F_CLIMAX) / (TOTAL - F_CLIMAX);
    return { Z: Z_FULL * (1 + 0.06 * smooth(s)), cx: full.cx, cy: full.cy };
  }
  if (i < 0) return ROUND_VIEW[0];
  if (i !== NR - 1) {
    const t = smooth((f - ROUND_START[i]) / (0.5 * CFG.fps));
    return i === 0 ? ROUND_VIEW[0] : blendView(ROUND_VIEW[i - 1], ROUND_VIEW[i], t);
  }
  // last round: dive onto the pen, stay close while it starts, then pull back as it accelerates
  const dive = smooth(u / 0.08), pull = smooth((u - 0.25) / 0.6);
  const Z = Z_FULL * Math.pow(Z_CLOSE / Z_FULL, dive * (1 - pull));
  const w = Math.pow((Z - Z_FULL) / (Z_CLOSE - Z_FULL), 0.6);
  // where the pen was over the last ~0.15 s: a smoothed follow that needs no state between frames
  const n = ROUND_LEN[i], off = ROUND_OFF[i];
  let sx = 0, sy = 0;
  for (let k = 0; k < 8; k++) {
    const q = Math.min(n - 1, Math.floor(progress(i, Math.max(0, u - k * 0.02 * CFG.fps / ROUND_FRAMES[i])) * n));
    sx += TRAILS[off + 2 * q]; sy += TRAILS[off + 2 * q + 1];
  }
  return { Z, cx: lerp(full.cx, sx / 8, w), cy: lerp(full.cy, sy / 8, w) };
}

// ---------- colour ----------
const roundHue = i => ((0.08 + 0.13 * i) % 1) * 360;
const hopAlpha = n => lerp(1, 0.04, clamp01((Math.log2(n) - 7) / 5));
const lineWidth = (n, Z) => lerp(2.6, 1.3, clamp01(Math.log2(n) / 11)) * Math.pow(Z, 0.4);
function paletteColor(p, level) {
  const [r, g, b] = META.palette[p];
  const k = 0.6 + 0.16 * level + 0.15 * PAL_LUM[p];
  const lift = Math.max(0, k - 1) * 255;
  const c = v => Math.round(Math.min(255, v * Math.min(k, 1) + lift));
  return `rgb(${c(r)}, ${c(g)}, ${c(b)})`;
}

// ---------- lines ----------
function project(view) {
  const { Z, cx, cy } = view;
  return { Z, ox: W / 2 - cx * Z, oy: H / 2 - cy * Z };
}

// one round's curve (up to fraction p) in a single colour; pen-up hops dimmed
function strokeRound(i, p, view, color, alpha, width) {
  const n = ROUND_LEN[i], off = ROUND_OFF[i], over = n / S;
  const { Z, ox, oy } = project(view);
  const stride = Math.max(1, Math.min(over, Math.floor(2.4 / ((100000 / n) * Z))));
  const end = Math.min(n - 1, Math.floor(p * n));
  const down = new Path2D(), hop = new Path2D();
  let last = -1;
  for (let k = 0; k + stride <= end; k += stride) {
    const j = k + stride;
    const up = UP[Math.floor(k / over)] || UP[Math.floor((j - 1) / over)];
    const path = up ? hop : down;
    const x0 = TRAILS[off + 2 * k] * Z + ox, y0 = TRAILS[off + 2 * k + 1] * Z + oy;
    const x1 = TRAILS[off + 2 * j] * Z + ox, y1 = TRAILS[off + 2 * j + 1] * Z + oy;
    if ((x0 < -50 && x1 < -50) || (x0 > W + 50 && x1 > W + 50) || (y0 < -50 && y1 < -50) || (y0 > H + 50 && y1 > H + 50)) { last = -1; continue; }
    if (last !== up) path.moveTo(x0, y0);
    path.lineTo(x1, y1);
    last = up;
  }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.globalAlpha = alpha;
  ctx.stroke(down);
  ctx.globalAlpha = alpha * hopAlpha(META.rounds[i]);
  ctx.stroke(hop);
  ctx.globalAlpha = 1;
}

// the last round in the painting's own colours, optionally pulsing with the music
function strokeFinal(p, view, levelFn) {
  const i = NR - 1, n = ROUND_LEN[i], off = ROUND_OFF[i], over = OS;
  const { Z, ox, oy } = project(view);
  const stride = Math.max(1, Math.min(over, Math.floor(2.4 / ((100000 / n) * Z))));
  const end = Math.min(n - 1, Math.floor(p * n));
  const paths = new Map();
  let lastKey = null;
  const fx = META.focus[0], fy = META.focus[1];
  for (let k = 0; k + stride <= end; k += stride) {
    const j = k + stride;
    const s = Math.floor(k / over);
    if (UP[s] || UP[Math.floor((j - 1) / over)]) { lastKey = null; continue; }
    const tx = TRAILS[off + 2 * k], ty = TRAILS[off + 2 * k + 1];
    const x0 = tx * Z + ox, y0 = ty * Z + oy;
    const x1 = TRAILS[off + 2 * j] * Z + ox, y1 = TRAILS[off + 2 * j + 1] * Z + oy;
    if ((x0 < -50 && x1 < -50) || (x0 > W + 50 && x1 > W + 50) || (y0 < -50 && y1 < -50) || (y0 > H + 50 && y1 > H + 50)) { lastKey = null; continue; }
    const level = levelFn ? levelFn(Math.hypot(tx - fx, ty - fy)) : 2;
    const key = PAL[s] * 8 + level;
    let path = paths.get(key);
    if (!path) { path = new Path2D(); paths.set(key, path); }
    if (key !== lastKey) path.moveTo(x0, y0);
    path.lineTo(x1, y1);
    lastKey = key;
  }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = lineWidth(META.rounds[i], Z) * 1.15;
  for (const [key, path] of paths) {
    ctx.strokeStyle = paletteColor(key >> 3, key & 7);
    ctx.stroke(path);
  }
}

// ---------- circles ----------
function chainAt(n, theta) {
  const pts = new Float64Array(2 * (n + 2));
  let x = 0, y = 0;
  for (let i = 0; i <= n; i++) {
    pts[2 * i] = x; pts[2 * i + 1] = y;
    const a = FREQ[i] * theta + PHASE[i];
    x += AMP[i] * Math.cos(a); y += AMP[i] * Math.sin(a);
  }
  pts[2 * (n + 1)] = x; pts[2 * (n + 1) + 1] = y;
  return pts;
}

// circles grouped by size octave: big ones gold and bold, small ones cool and faint
function drawCircles(n, chain, view, opt = {}) {
  const { Z, ox, oy } = project(view);
  const alpha = opt.alpha ?? 1, grow = opt.grow ?? 1, fresh = opt.fresh ?? 1;
  const octaves = Math.ceil(Math.log2(n + 1)) + 1;
  const rings = Array.from({ length: octaves }, () => new Path2D());
  const arms = new Path2D();
  const dots = new Path2D();
  let drawn = 0;
  for (let i = 1; i <= n; i++) {
    const x = chain[2 * i] * Z + ox, y = chain[2 * i + 1] * Z + oy;
    const r = AMP[i] * Z;
    if (r < 0.5) { arms.lineTo(x, y); break; }
    if (i === 1) arms.moveTo(x, y); else arms.lineTo(x, y);
    if (n <= 32) { dots.moveTo(x + 2.6, y); dots.arc(x, y, 2.6, 0, Math.PI * 2); }
    const R = r * grow;
    if (R < 2 + 0.4 * Z || drawn > 9000) continue;
    if (Math.abs(x - W / 2) > W / 2 + R || Math.abs(y - H / 2) > H / 2 + R) continue;
    const b = Math.floor(Math.log2(i));
    rings[b].moveTo(x + R, y);
    rings[b].arc(x, y, R, 0, Math.PI * 2);
    drawn++;
  }
  const tx = chain[2 * (n + 1)] * Z + ox, ty = chain[2 * (n + 1) + 1] * Z + oy;
  arms.lineTo(tx, ty);
  const newest = Math.floor(Math.log2(n));
  // dark halo so the mechanism reads over finished lines
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 4;
  ctx.globalAlpha = 0.5 * alpha;
  for (let b = 0; b < Math.min(octaves, 7); b++) ctx.stroke(rings[b]);
  if (!opt.burst) ctx.stroke(arms);
  for (let b = 0; b < octaves; b++) {
    const t = b / 14;
    let a = lerp(0.75, 0.1, Math.pow(t, 0.6)) * alpha;
    if (b === newest && n > 1) a *= fresh;
    ctx.globalAlpha = a;
    ctx.strokeStyle = `hsl(${lerp(42, 215, t)}, 90%, ${lerp(72, 70, t)}%)`;
    ctx.lineWidth = lerp(2, 1, t);
    ctx.stroke(rings[b]);
  }
  if (!opt.burst) {
    ctx.globalAlpha = (n <= 256 ? 0.85 : 0.6) * alpha;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = n <= 16 ? 2 : 1.3;
    ctx.stroke(arms);
    ctx.fillStyle = '#fff';
    ctx.fill(dots);
    const g = ctx.createRadialGradient(tx, ty, 0, tx, ty, 22);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.3, 'rgba(255,240,210,0.45)');
    g.addColorStop(1, 'rgba(255,220,160,0)');
    ctx.globalAlpha = alpha;
    ctx.fillStyle = g;
    ctx.fillRect(tx - 22, ty - 22, 44, 44);
  }
  ctx.globalAlpha = 1;
}

// ---------- glow ----------
function bloom(strength) {
  sctx.globalCompositeOperation = 'copy';
  sctx.drawImage(canvas, 0, 0, W / 4, H / 4);
  sctx2.globalCompositeOperation = 'copy';
  sctx2.filter = 'blur(5px)';
  sctx2.drawImage(small, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  ctx.imageSmoothingQuality = 'high';
  ctx.globalAlpha = Math.min(1, strength);
  ctx.drawImage(small2, 0, 0, W, H);
  if (strength > 1) { ctx.globalAlpha = strength - 1; ctx.drawImage(small2, 0, 0, W, H); }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

// a ring of light from the swirl on every other beat after the climax
function rippleLevel(f) {
  const t = (f - F_CLIMAX) / CFG.fps;
  const period = 2 * 60 / CFG.bpm;
  const fade = clamp01((TOTAL - f) / CFG.fps / 4);
  return r => {
    let b = 0;
    for (let j = 0; j < 12; j++) {
      const tj = 0.9 + j * period;
      if (t < tj) break;
      const d = r - 650 * (t - tj);
      b += Math.exp(-(d * d) / (2 * 55 * 55));
    }
    return Math.max(0, Math.min(4, Math.round(2 + b * 2.2 * fade)));
  };
}

let finalChain = null;
function renderFrame(f, draw = true) {
  const i = roundAt(f);
  const u = i >= 0 && f < F_CLIMAX ? (f - ROUND_START[i]) / ROUND_FRAMES[i] : 0;
  const p = i >= 0 && f < F_CLIMAX ? progress(i, u) : 1;
  if (!draw) return;
  const view = camera(f, i, u, p);

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  if (f < F_CLIMAX) {
    // earlier rounds, fading with age
    const cur = Math.max(0, i);
    for (let j = Math.max(0, cur - 5); j < cur; j++) {
      const age = cur - j;
      const n = META.rounds[j];
      const ghost = (i === NR - 1 ? 0.28 : 0.6) * Math.pow(0.5, age - 1);   // dimmer under the last round
      strokeRound(j, 1, view, `hsl(${roundHue(j)}, 100%, 60%)`, ghost, lineWidth(n, view.Z));
    }
    if (i >= 0) {
      const n = META.rounds[i];
      if (i === NR - 1) strokeFinal(p, view, null);
      else strokeRound(i, p, view, `hsl(${roundHue(i)}, 100%, 64%)`, 1, lineWidth(n, view.Z));
    }
    bloom(0.75);
    const n = META.rounds[Math.max(0, i)];
    const chain = chainAt(n, 2 * Math.PI * p);
    if (i === NR - 1) finalChain = chain;
    const intro = i < 0 ? smooth(f / F_INTRO) : 1;
    const fresh = i >= 0 ? smooth((f - ROUND_START[i]) / (0.35 * CFG.fps)) : 1;
    drawCircles(n, chain, view, { alpha: intro, fresh, grow: i < 0 ? intro : 1 });
  } else {
    const s = (f - F_CLIMAX) / CFG.fps;
    // every approximation at once, a rainbow of all the rounds, dissolving into the finished picture
    const recap = 0.38 * Math.exp(-s * 0.9) * smooth(s / 0.15);
    if (recap > 0.01) {
      for (let j = 0; j < NR - 1; j++) {
        strokeRound(j, 1, view, `hsl(${roundHue(j)}, 100%, 62%)`, recap * (0.4 + 0.6 * j / (NR - 2)), lineWidth(META.rounds[j], view.Z));
      }
    }
    strokeFinal(1, view, s > 0.6 ? rippleLevel(f) : null);
    bloom(0.8 + 0.6 * Math.exp(-s * 2.5));
    // burst of light from the centre of the picture
    const a = 0.5 * Math.exp(-s * 5);
    if (a > 0.004) {
      const cx = W / 2, cy = H / 2;
      const rad = 260 + 900 * (1 - Math.exp(-s * 4));
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
      g.addColorStop(0, `rgba(255, 250, 235, ${a})`);
      g.addColorStop(0.4, `rgba(255, 230, 190, ${a * 0.35})`);
      g.addColorStop(1, 'rgba(255, 220, 170, 0)');
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'source-over';
    }
    // the circles fly apart
    if (!finalChain) finalChain = chainAt(META.rounds[NR - 1], 2 * Math.PI);
    const b = clamp01(s / 0.9);
    if (finalChain && b < 1) drawCircles(META.rounds[NR - 1], finalChain, view, { alpha: (1 - b) * (1 - b), grow: 1 + 2.6 * Math.pow(b, 0.7), burst: true });
  }

  const fadeIn = smooth(f / (0.5 * CFG.fps));
  const fadeOut = smooth((TOTAL - 1 - f) / (CFG.fadeOut * CFG.fps));
  const k = Math.min(fadeIn, fadeOut);
  if (k < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - k})`; ctx.fillRect(0, 0, W, H); }
}
</script>
