<!doctype html>
<meta charset="utf-8">
<title>Starry Night epicycles</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
<canvas id="c"></canvas>
<script>
// Frame-by-frame renderer. render.js serves this folder, calls init() once, then renderFrame(0..total-1) in order.
//
// Story: extreme close-up on the pen at the centre of the big swirl -> the camera pulls back as the
// drawing spreads outward and the pen speeds up exponentially -> the last stroke closes, the circles
// burst, a shockwave turns the rainbow lines into the painting's own colours -> the painting pulses.

let CFG, META, W, H, PW, PH, M;
let FREQ, AMP, PHASE, K;
let TX, TY, R, UPC, PAL, RMAX;   // trail x/y, distance from focus, pen-up prefix count, palette index
let REACH;                        // running max of R: how far out the drawing has reached
const canvas = document.getElementById('c');
let ctx, small, sctx, small2, sctx2;

const clamp01 = t => Math.max(0, Math.min(1, t));
const smooth = t => { t = clamp01(t); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;

async function init() {
  const get = async (p, kind) => { const r = await fetch(p); return kind === 'json' ? r.json() : r.arrayBuffer(); };
  CFG = await get('config.json', 'json');
  META = await get('data/meta.json', 'json');
  W = CFG.width; H = CFG.height;
  canvas.width = W; canvas.height = H;
  ctx = canvas.getContext('2d');
  small = new OffscreenCanvas(W / 4, H / 4);
  sctx = small.getContext('2d');
  small2 = new OffscreenCanvas(W / 4, H / 4);
  sctx2 = small2.getContext('2d');
  PW = META.paintingWidth; PH = META.paintingHeight;

  const terms = await get('data/terms.bin');
  K = META.terms;
  FREQ = new Int32Array(terms, 0, K);
  AMP = new Float32Array(terms, 4 * K, K);
  PHASE = new Float32Array(terms, 8 * K, K);

  const trail = new Float32Array(await get('data/trail.bin'));
  const attr = new Uint8Array(await get('data/attr.bin'));
  M = trail.length / 2;
  TX = new Float32Array(M); TY = new Float32Array(M); R = new Float32Array(M);
  UPC = new Uint32Array(M + 1); PAL = new Uint8Array(M); REACH = new Float32Array(M);
  const [fx, fy] = META.focus;
  let reach = 0;
  for (let i = 0; i < M; i++) {
    TX[i] = trail[2 * i]; TY[i] = trail[2 * i + 1];
    R[i] = Math.hypot(TX[i] - fx, TY[i] - fy);
    UPC[i + 1] = UPC[i] + attr[2 * i];
    PAL[i] = attr[2 * i + 1];
    if (!attr[2 * i] && R[i] > reach) reach = R[i];
    REACH[i] = reach;
  }
  RMAX = reach;
  const lum = META.palette.map(([r, g, b]) => 0.3 * r + 0.59 * g + 0.11 * b);
  const lo = Math.min(...lum), hi = Math.max(...lum);
  PAL_LUM = lum.map(v => Math.min(LUMS - 1, Math.floor((v - lo) / (hi - lo + 1e-6) * LUMS)));
  buildSchedule();
  return { total: TOTAL, fps: CFG.fps };
}

// ---------- schedule ----------
let TOTAL, F_START, F_CLIMAX, F_WAVE, F_END, V0, KR;
let ZOOM0;
function buildSchedule() {
  const fps = CFG.fps;
  F_START = Math.round(0.4 * fps);
  F_CLIMAX = Math.round(CFG.climax * fps);
  F_WAVE = Math.round(CFG.wave * fps);
  F_END = Math.round(CFG.end * fps);
  TOTAL = F_END;
  // pen speed v(f) = V0 * e^(KR f): solve KR so the whole line is drawn exactly at the climax
  V0 = 3;
  const n = F_CLIMAX - F_START;
  let lo = 1e-5, hi = 0.05;
  for (let i = 0; i < 100; i++) {
    const k = (lo + hi) / 2;
    (V0 * (Math.exp(k * n) - 1) / k > M) ? hi = k : lo = k;
  }
  KR = (lo + hi) / 2;
  ZOOM0 = (W / 2) / 26;  // the opening view is 52 painting-pixels wide
}

function progressAt(f) {
  if (f <= F_START) return 0;
  if (f >= F_CLIMAX) return M;
  const x = f - F_START;
  return Math.min(M, V0 * (Math.exp(KR * x) - 1) / KR);
}

// ---------- camera ----------
const cam = { logE: 0, init: false };
function camera(f, P) {
  const halfFinal = W / 2;                                  // painting fills the width at zoom 1
  const reach = P > 0 ? REACH[Math.min(M - 1, Math.floor(P))] : 0;
  const target = Math.min(halfFinal, Math.max(W / 2 / ZOOM0, reach * 1.2));
  if (!cam.init) { cam.logE = Math.log(target); cam.init = true; }
  cam.logE += (Math.log(target) - cam.logE) * 0.06;         // ease toward the target framing
  let Z = Math.max(1, halfFinal / Math.exp(cam.logE));
  // after the reveal, a slow push in
  if (f > F_CLIMAX + F_WAVE) Z *= 1 + 0.07 * smooth((f - F_CLIMAX - F_WAVE) / (F_END - F_CLIMAX - F_WAVE));
  const w = Math.pow(clamp01(Math.log(Z) / Math.log(ZOOM0)), 0.6);
  const [fx, fy] = META.focus;
  const cx = lerp(PW / 2, fx, w), cy = lerp(PH / 2, fy, w);
  return { Z, cx, cy };
}

// ---------- colour ----------
const RAINBOW = 48;
const LEVELS = 5;
const LUMS = 3;
const rainbowColor = (b, l) => `hsl(${(b / RAINBOW) * 360}, 100%, ${44 + 14 * l}%)`;
let PAL_LUM;  // 0..LUMS-1 brightness class of each palette colour
function paletteColor(p, level) {
  const [r, g, b] = META.palette[p];
  const k = 0.55 + 0.17 * level + 0.12 * PAL_LUM[p];        // ripple level, plus extra for bright colours
  const lift = Math.max(0, k - 1) * 255;                     // above 1 we push toward white
  const c = v => Math.round(Math.min(255, v * Math.min(k, 1) + lift));
  return `rgb(${c(r)}, ${c(g)}, ${c(b)})`;
}

// ---------- drawing ----------
const paths = new Map();
function pathFor(key) {
  let p = paths.get(key);
  if (!p) { p = { path: new Path2D(), open: false }; paths.set(key, p); }
  return p;
}

function drawLines(f, P, view, phase) {
  const { Z, cx, cy } = view;
  const t = f / CFG.fps;
  const stride = Math.max(1, Math.min(8, Math.floor(2.4 / (0.3 * Z))));
  const ox = W / 2 - cx * Z, oy = H / 2 - cy * Z;
  const margin = 40;
  paths.clear();
  const end = Math.floor(P);
  const waveR = phase.waveR, band = 70;
  let lastKey = null, prevVisible = false;
  let px = 0, py = 0;
  for (let i = 0; i + stride <= end; i += stride) {
    const j = i + stride;
    if (UPC[j] - UPC[i] > 0) { lastKey = null; continue; }   // pen up somewhere in this step
    const x0 = TX[i] * Z + ox, y0 = TY[i] * Z + oy;
    const x1 = TX[j] * Z + ox, y1 = TY[j] * Z + oy;
    if ((x0 < -margin && x1 < -margin) || (x0 > W + margin && x1 > W + margin) ||
        (y0 < -margin && y1 < -margin) || (y0 > H + margin && y1 > H + margin)) { lastKey = null; continue; }
    let key;
    const r = R[i];
    if (r < waveR - band) {
      key = phase.level ? 'p' + PAL[i] + ':' + phase.level(r) : 'p' + PAL[i] + ':2';
    } else if (r < waveR) {
      key = 'w';
    } else {
      const hue = Math.log2(r + 8) * 0.5 - t * 0.1 + (PAL[i] / 64 - 0.5) * 0.08;
      key = 'h' + (((Math.floor(hue * RAINBOW) % RAINBOW) + RAINBOW) % RAINBOW) + ':' + PAL_LUM[PAL[i]];
    }
    const p = pathFor(key);
    if (key !== lastKey) p.path.moveTo(x0, y0);
    p.path.lineTo(x1, y1);
    lastKey = key;
  }
  const width = 1.25 * Math.pow(Z, 0.42) * (phase.level ? 1.3 : 1);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = width;
  for (const [key, p] of paths) {
    if (key === 'w') { ctx.strokeStyle = '#fff8e8'; ctx.lineWidth = width * 1.8; }
    else if (key[0] === 'h') { const [hb, lb] = key.slice(1).split(':'); ctx.strokeStyle = rainbowColor(+hb, +lb); ctx.lineWidth = width; }
    else { const [pp, lv] = key.slice(1).split(':'); ctx.strokeStyle = paletteColor(+pp, +lv); ctx.lineWidth = width; }
    ctx.stroke(p.path);
  }
}

function chainAt(theta) {
  // positions of every circle centre for parameter theta; returns Float64Array [x0,y0,x1,y1,...] and the tip
  const pts = new Float64Array(2 * (K + 1));
  let x = 0, y = 0;
  for (let i = 0; i < K; i++) {
    pts[2 * i] = x; pts[2 * i + 1] = y;
    const a = FREQ[i] * theta + PHASE[i];
    x += AMP[i] * Math.cos(a); y += AMP[i] * Math.sin(a);
  }
  pts[2 * K] = x; pts[2 * K + 1] = y;
  return pts;
}

function drawEpicycles(chain, view, alpha, burst = 0) {
  if (alpha <= 0.002) return;
  const { Z, cx, cy } = view;
  const ox = W / 2 - cx * Z, oy = H / 2 - cy * Z;
  const rings = new Path2D(), arms = new Path2D();
  const grow = 1 + 2.6 * Math.pow(burst, 0.7);
  // only the circles big enough to read; the sub-pixel tail is folded into the last arm
  // big circles get spokes and a clear outline; the long tail of small ones is a faint lace
  const ARMS = 80;
  const bigRings = new Path2D();
  for (let i = 1; i < Math.min(K, 3000); i++) {
    const x = chain[2 * i] * Z + ox, y = chain[2 * i + 1] * Z + oy;
    if (i <= ARMS) { if (i === 1) arms.moveTo(x, y); else arms.lineTo(x, y); }
    const r = AMP[i] * Z * grow;
    if (r < 3) { if (i > ARMS) break; continue; }
    if (Math.abs(x - W / 2) > W / 2 + r || Math.abs(y - H / 2) > H / 2 + r) continue;
    const target = i <= ARMS ? bigRings : rings;
    target.moveTo(x + r, y);
    target.arc(x, y, r, 0, Math.PI * 2);
  }
  const tipX = chain[2 * K] * Z + ox, tipY = chain[2 * K + 1] * Z + oy;
  ctx.lineWidth = 1;
  ctx.strokeStyle = '#bcd2ff';
  ctx.globalAlpha = 0.08 * alpha;
  ctx.stroke(rings);
  ctx.globalAlpha = 0.3 * alpha;
  ctx.stroke(bigRings);
  if (!burst) {
    ctx.globalAlpha = 0.42 * alpha;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    ctx.stroke(arms);
    const g = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, 18);
    g.addColorStop(0, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.35, 'rgba(255,240,210,0.35)');
    g.addColorStop(1, 'rgba(255,220,160,0)');
    ctx.globalAlpha = alpha;
    ctx.fillStyle = g;
    ctx.fillRect(tipX - 18, tipY - 18, 36, 36);
  }
  ctx.globalAlpha = 1;
}

function bloom(strength) {
  if (strength <= 0) return;
  sctx.globalCompositeOperation = 'copy';
  sctx.drawImage(canvas, 0, 0, W / 4, H / 4);
  sctx2.globalCompositeOperation = 'copy';
  sctx2.filter = 'blur(5px)';
  sctx2.drawImage(small, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = Math.min(1, strength);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(small2, 0, 0, W, H);
  if (strength > 1) { ctx.globalAlpha = strength - 1; ctx.drawImage(small2, 0, 0, W, H); }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

// ripples of light from the swirl, one every two beats after the reveal
function rippleLevel(f) {
  const t = f / CFG.fps;
  const start = CFG.climax + CFG.wave * 0.6;
  const period = 2 * 60 / CFG.bpm;
  const speed = 620;
  const fade = clamp01((CFG.end - t) / 4);
  const breathing = 0.5 + 0.5 * Math.sin(t * 2.1);
  return r => {
    let b = 0;
    for (let j = 0; j < 12; j++) {
      const tj = start + j * period;
      if (t < tj) break;
      const d = r - speed * (t - tj);
      b += Math.exp(-(d * d) / (2 * 55 * 55));
    }
    b *= fade;
    return Math.max(0, Math.min(LEVELS - 1, Math.round(1.6 + 0.6 * breathing + b * 2.4)));
  };
}

let chainCache = null;
// draw=false only advances the camera (it eases frame to frame), so previews can jump ahead cheaply
function renderFrame(f, draw = true) {
  const P = progressAt(f);
  const view = camera(f, P);
  if (!draw) {
    if (f === F_CLIMAX - 1) chainCache = chainAt(2 * Math.PI * P / M);
    return;
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // colour phase
  const tw = (f - F_CLIMAX) / F_WAVE;                        // 0..1 during the shockwave
  const phase = { waveR: -1e9, level: null };
  if (f >= F_CLIMAX) {
    phase.waveR = smooth(tw) * (RMAX + 200) * 1.02 + (tw > 0 ? 70 : 0);
    if (tw > 0.3) phase.level = rippleLevel(f);
  }
  drawLines(f, P, view, phase);

  // glow: steady while drawing, a surge at the climax, then a soft pulse with the ripples
  let glow = 0.7;
  if (f >= F_CLIMAX) glow = 0.8 + 0.7 * Math.exp(-((f - F_CLIMAX) / CFG.fps) * 2.5);
  bloom(glow);
  if (f >= F_CLIMAX) {
    // a burst of light from the centre of the swirl
    const s = (f - F_CLIMAX) / CFG.fps;
    const a = 0.85 * Math.exp(-s * 5);
    if (a > 0.004) {
      const fx = W / 2 + (META.focus[0] - view.cx) * view.Z, fy = H / 2 + (META.focus[1] - view.cy) * view.Z;
      const rad = 250 + 900 * (1 - Math.exp(-s * 4));
      const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, rad);
      g.addColorStop(0, `rgba(255, 250, 235, ${a})`);
      g.addColorStop(0.4, `rgba(255, 230, 190, ${a * 0.35})`);
      g.addColorStop(1, 'rgba(255, 220, 170, 0)');
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  // circles: following the pen, then bursting outward at the climax
  if (f < F_CLIMAX) {
    chainCache = chainAt(2 * Math.PI * P / M);
    drawEpicycles(chainCache, view, Math.min(1, (f + 1) / 20));
  } else if (chainCache) {
    const b = clamp01((f - F_CLIMAX) / (0.9 * CFG.fps));
    drawEpicycles(chainCache, view, (1 - b) * (1 - b), b);
  }

  // fade in / out
  const fadeIn = smooth(f / (0.8 * CFG.fps));
  const fadeOut = smooth((F_END - 1 - f) / (CFG.fadeOut * CFG.fps));
  const k = Math.min(fadeIn, fadeOut);
  if (k < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - k})`; ctx.fillRect(0, 0, W, H); }
}
</script>
